name: delivery_app
description: "Aplicación de delivery con Flutter y Django"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Dependencias básicas
  provider: ^6.0.5
  shared_preferences: ^2.3.2
  http: ^1.2.0
  
  # Para geolocalización
  geolocator: ^9.0.2
  geocoding: ^2.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/


